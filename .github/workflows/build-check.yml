name: WoodShop Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: woodshop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo "Built asset sizes:"
          find dist -type f -printf '%s %p\n' | sort -nr
